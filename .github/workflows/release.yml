name: release

# Fork variant of the upstream release workflow.
#
# Upstream (awslabs/filemoverexpress) signs and notarizes the macOS and Windows
# artifacts through Amazon-internal services (CD Signer, AWS Code Signer) that are
# gated behind the `signing` environment and the *_SIGNING_ENABLED repository
# variables. Those services are not reachable from a fork, and the upstream
# create-release job hard-fails without the signed macOS .dmg files they produce.
#
# This variant has no special needs: it builds every platform unsigned, packages
# the macOS .app into a .dmg on the build runner itself, and publishes a GitHub
# Release using only the automatic GITHUB_TOKEN. No secrets, variables, or
# environments are required. The published asset names are identical to upstream.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (semver format, e.g., 1.2.3)'
        required: true
        type: string

permissions:
  contents: read

jobs:
  generate-protobuf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4 # v4
      - uses: ./.github/actions/setup-environment
        with:
          working-directory: src/protobuf
      - uses: ./.github/actions/generate-protobuf

  generate-bindings:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4 # v4
      - uses: ./.github/actions/setup-environment
      - uses: ./.github/actions/generate-bindings

  # ---------------------------------------------------------------------------
  # Desktop installers (macOS .dmg, Windows NSIS .exe), unsigned
  #
  # `task wails:package` (via the generate-installer action) produces an ad-hoc
  # signed .app on macOS and the NSIS installer .exe on Windows. The .dmg is built
  # here from the unsigned .app, mirroring the "Build .dmg from signed .app" step
  # of the upstream sign-macos.yml so the asset layout (bundle renamed to the
  # human-facing display name, /Applications symlink, UDZO image) stays the same.
  # ---------------------------------------------------------------------------
  generate-installer:
    needs: [generate-protobuf, generate-bindings]
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: mac
            architecture: x64
            runner: macos-15-intel
          - platform: mac
            architecture: arm64
            runner: macos-latest
          - platform: win
            architecture: x64
            runner: windows-latest
          - platform: win
            architecture: arm64
            runner: windows-11-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4 # v4
      - uses: ./.github/actions/setup-environment
      - uses: ./.github/actions/download-protobuf
      - uses: ./.github/actions/download-bindings
      - uses: ./.github/actions/generate-installer
        with:
          platform: ${{ matrix.platform }}
          architecture: ${{ matrix.architecture }}
          build-version: ${{ inputs.version || github.ref_name }}

      - name: Build .dmg from unsigned .app (macOS)
        if: matrix.platform == 'mac'
        shell: bash
        env:
          # APP_NAME must match src/wails/Taskfile.yml; DISPLAY_NAME is the bundle
          # name shown in Finder; DMG_BASENAME controls the published asset filename.
          APP_NAME: FileMoverExpressUI
          DISPLAY_NAME: File Mover Express
          DMG_BASENAME: filemoverexpress-macos
          ARCH: ${{ matrix.architecture }}
        run: |
          set -euo pipefail
          DMG_NAME="${DMG_BASENAME}-${ARCH}"
          if [ ! -d "dist/${APP_NAME}.app" ]; then
            echo "ERROR: dist/${APP_NAME}.app not found after packaging" >&2
            ls -la dist >&2
            exit 1
          fi
          rm -rf dist/dmg-staging "dist/${DMG_NAME}.dmg"
          mkdir -p dist/dmg-staging
          # ditto (not cp -R) preserves extended attributes and the ad-hoc signature.
          ditto "dist/${APP_NAME}.app" "dist/dmg-staging/${DISPLAY_NAME}.app"
          ln -s /Applications dist/dmg-staging/Applications
          hdiutil create -volname "${DISPLAY_NAME}" -srcfolder dist/dmg-staging -ov -format UDZO "dist/${DMG_NAME}.dmg"
          rm -rf dist/dmg-staging
          echo "Built dist/${DMG_NAME}.dmg (app bundle: ${DISPLAY_NAME}.app)"

      - name: Upload macOS .dmg
        if: matrix.platform == 'mac'
        uses: actions/upload-artifact@v4
        with:
          name: dmg-mac-${{ matrix.architecture }}
          path: dist/filemoverexpress-macos-${{ matrix.architecture }}.dmg
          retention-days: 30

  # ---------------------------------------------------------------------------
  # MCP server binary build (fme-mcp), unsigned, all platforms
  # ---------------------------------------------------------------------------
  build-mcp:
    needs: [generate-protobuf]
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: mac
            architecture: x64
            runner: macos-15-intel
            goos: darwin
            goarch: amd64
          - platform: mac
            architecture: arm64
            runner: macos-latest
            goos: darwin
            goarch: arm64
          - platform: win
            architecture: x64
            runner: windows-latest
            goos: windows
            goarch: amd64
          - platform: linux
            architecture: x64
            runner: ubuntu-latest
            goos: linux
            goarch: amd64
          - platform: linux
            architecture: arm64
            runner: ubuntu-24.04-arm
            goos: linux
            goarch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-environment
      - uses: ./.github/actions/download-protobuf
      - name: Build fme-mcp
        shell: bash
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          BUILD_VERSION: ${{ inputs.version || github.ref_name }}
        run: |
          cd src/cli
          CGO_ENABLED=0 go build -trimpath \
            -ldflags "-s -w -X \"main.Version=v${BUILD_VERSION}\"" \
            -o "../../dist/fme-mcp${{ matrix.goos == 'windows' && '.exe' || '' }}" \
            mcp-main.go
      - uses: actions/upload-artifact@v4
        with:
          name: mcp-${{ matrix.platform }}-${{ matrix.architecture }}
          path: dist/fme-mcp*
          retention-days: 30

  # ---------------------------------------------------------------------------
  # Headless CLI daemon build (filemoverexpress), Linux only
  #
  # Linux is not shipped as a desktop GUI (native WebKitGTK dependencies); Linux
  # users run the headless daemon and drive it from a GUI on another machine. The
  # macOS and Windows desktop installers bundle this same daemon. The binary is
  # pure Go (CGO_ENABLED=0) and builds straight to its final release asset name.
  # ---------------------------------------------------------------------------
  build-cli:
    needs: [generate-protobuf]
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: amd64
            runner: ubuntu-latest
          - architecture: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-environment
      - uses: ./.github/actions/download-protobuf
      - name: Build filemoverexpress CLI daemon
        shell: bash
        env:
          GOOS: linux
          GOARCH: ${{ matrix.architecture }}
          BUILD_VERSION: ${{ inputs.version || github.ref_name }}
        run: |
          cd src/cli
          CGO_ENABLED=0 go build -trimpath \
            -ldflags "-s -w -X \"main.Version=v${BUILD_VERSION}\"" \
            -o "../../dist/filemoverexpress-linux-${{ matrix.architecture }}" \
            main.go
      - uses: actions/upload-artifact@v4
        with:
          name: cli-linux-${{ matrix.architecture }}
          path: dist/filemoverexpress-linux-*
          retention-days: 30

  # ---------------------------------------------------------------------------
  # Create GitHub Release
  #
  # Collects the unsigned artifacts and publishes them as a GitHub Release. Runs
  # whenever the workflow was not cancelled so that one failed build leg still
  # surfaces as a clear "missing asset" error from the gate below rather than a
  # silently skipped job.
  #
  # NOT included: Linux desktop installers (require native CGo/webkit dependencies
  # not available on CI runners).
  # ---------------------------------------------------------------------------
  create-release:
    needs:
      - generate-installer
      - build-mcp
      - build-cli
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ inputs.version || github.ref_name }}
    steps:
      - uses: actions/checkout@v4

      - name: Prepare release directory
        run: mkdir -p release-assets

      # Each download keeps continue-on-error so that every missing asset is
      # reported at once by the strict gate below, instead of failing on the first.

      # ----- macOS desktop app (.dmg, unsigned) -----
      - name: Download macOS x64 .dmg
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: dmg-mac-x64
          path: release-assets

      - name: Download macOS arm64 .dmg
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: dmg-mac-arm64
          path: release-assets

      # ----- Windows installer (.exe, unsigned) -----
      - name: Download Windows x64 installer
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: installer-win-x64
          path: release-assets

      - name: Download Windows arm64 installer
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: installer-win-arm64
          path: release-assets

      # ----- MCP server binaries (unsigned) -----
      - name: Download MCP macOS x64
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: mcp-mac-x64
          path: release-assets/mcp-mac-x64

      - name: Download MCP macOS arm64
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: mcp-mac-arm64
          path: release-assets/mcp-mac-arm64

      - name: Download MCP Windows x64
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: mcp-win-x64
          path: release-assets/mcp-win-x64

      - name: Download MCP Linux x64
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: mcp-linux-x64
          path: release-assets/mcp-linux-x64

      - name: Download MCP Linux arm64
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: mcp-linux-arm64
          path: release-assets/mcp-linux-arm64

      # ----- Headless CLI daemon: Linux -----
      # Already named filemoverexpress-linux-<arch> by build-cli; no rename needed.
      - name: Download CLI daemon Linux amd64
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: cli-linux-amd64
          path: release-assets

      - name: Download CLI daemon Linux arm64
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: cli-linux-arm64
          path: release-assets

      # ----- Rename MCP binaries for clarity -----
      - name: Rename MCP binaries with platform/arch suffix
        run: |
          set -euo pipefail
          rename_mcp() {
            local dir="$1" platform="$2" arch="$3" ext="${4:-}"
            local src="release-assets/${dir}/fme-mcp${ext}"
            if [ ! -f "$src" ]; then
              src=$(find "release-assets/${dir}" -type f -name "fme-mcp${ext}" 2>/dev/null | head -n1)
            fi
            if [ -f "$src" ]; then
              mv "$src" "release-assets/fme-mcp-${platform}-${arch}${ext}"
              echo "Renamed: fme-mcp-${platform}-${arch}${ext}"
            fi
          }
          # The macOS platform token is intentionally "darwin", not "macos": it matches
          # Go's GOOS value and the output of `uname` on macOS, which is the conventional
          # token for CLI/server binaries and lets OS-detecting install scripts resolve
          # the right asset. (The end-user-facing .dmg uses "macos" and is a separate
          # concern.)
          rename_mcp "mcp-mac-x64"     "darwin"  "amd64"
          rename_mcp "mcp-mac-arm64"   "darwin"  "arm64"
          rename_mcp "mcp-win-x64"     "windows" "amd64" ".exe"
          rename_mcp "mcp-linux-x64"   "linux"   "amd64"
          rename_mcp "mcp-linux-arm64" "linux"   "arm64"
          # Clean up subdirectories
          rm -rf release-assets/mcp-*

      # ----- List final assets -----
      - name: Verify all expected release assets are present
        # Hard gate: fail the entire run if ANY expected binary is missing, instead
        # of publishing an incomplete release that looks green.
        run: |
          set -euo pipefail
          echo "=== Release assets ==="
          find release-assets -type f | sort
          EXPECTED=(
            filemoverexpress-macos-x64.dmg
            filemoverexpress-macos-arm64.dmg
            filemoverexpress-windows-amd64-installer.exe
            filemoverexpress-windows-arm64-installer.exe
            filemoverexpress-linux-amd64
            filemoverexpress-linux-arm64
            fme-mcp-darwin-amd64
            fme-mcp-darwin-arm64
            fme-mcp-windows-amd64.exe
            fme-mcp-linux-amd64
            fme-mcp-linux-arm64
          )
          MISSING=0
          for f in "${EXPECTED[@]}"; do
            if [ ! -f "release-assets/${f}" ]; then
              echo "::error::Missing expected release asset: ${f}"
              MISSING=1
            fi
          done
          if [ "${MISSING}" -ne 0 ]; then
            echo "ERROR: refusing to publish an incomplete release - fix the failed upstream job(s) or the asset naming and re-run" >&2
            exit 1
          fi
          echo "All ${#EXPECTED[@]} expected assets present."

      # ----- Create GitHub Release -----
      - name: Determine if prerelease
        id: prerelease
        run: |
          if echo "${VERSION}" | grep -qE '\-'; then
            echo "is_prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.VERSION }}
          name: File Mover Express ${{ env.VERSION }}
          draft: false
          prerelease: ${{ steps.prerelease.outputs.is_prerelease == 'true' }}
          generate_release_notes: true
          files: release-assets/*
          fail_on_unmatched_files: false
          body: |
            File Mover Express is a high-performance app for moving media between local
            storage and Amazon S3 - a Go transfer daemon plus a desktop GUI, a CLI, and an
            MCP server. What changed in this release is listed under **What's Changed** below.

            For a full feature overview, see the [README](${{ github.server_url }}/${{ github.repository }}#readme).

            > **Unsigned builds.** The binaries in this release are not code-signed or
            > notarized. macOS: control-click the app and choose *Open* on first launch
            > (or run `xattr -d com.apple.quarantine` on the `.app`). Windows: choose
            > *More info* then *Run anyway* in the SmartScreen prompt.

            ## Downloads

            | Platform | Architecture | Asset |
            |----------|-------------|-------|
            | macOS | Apple Silicon (arm64) | `filemoverexpress-macos-arm64.dmg` |
            | macOS | Intel (x64) | `filemoverexpress-macos-x64.dmg` |
            | Windows | x64 | `filemoverexpress-windows-amd64-installer.exe` |
            | Windows | arm64 | `filemoverexpress-windows-arm64-installer.exe` |

            ### Headless CLI daemon (Linux)

            Linux ships as a headless daemon, not a desktop app. Run it on a server,
            render farm, or cloud instance and drive it from a GUI on another machine
            over a remote-daemon connection. See the
            [Headless Linux Installation guide](docs/Headless-Linux-Installation.md).

            | Architecture | Asset |
            |-------------|-------|
            | x86_64 (Intel/AMD) | `filemoverexpress-linux-amd64` |
            | ARM64 (Graviton, etc.) | `filemoverexpress-linux-arm64` |

            ### MCP Server Binaries

            | Platform | Architecture | Asset |
            |----------|-------------|-------|
            | macOS | Apple Silicon | `fme-mcp-darwin-arm64` |
            | macOS | Intel | `fme-mcp-darwin-amd64` |
            | Windows | x64 | `fme-mcp-windows-amd64.exe` |
            | Linux | x64 | `fme-mcp-linux-amd64` |
            | Linux | arm64 | `fme-mcp-linux-arm64` |

            > **Linux desktop app** is not distributed: Linux is supported as a headless
            > CLI daemon only (see the table above). Control it from a GUI on another machine
            > over a remote-daemon connection. Building the desktop GUI from source is still
            > possible - see the [Installation guide](docs/Installation.md).
