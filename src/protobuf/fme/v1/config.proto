syntax = "proto3";

package fme.v1;

option go_package = "github.com/awslabs/filemoverexpress/protobuf";

enum LogFileSeverity {
    LOG_FILE_SEVERITY_UNSPECIFIED = 0;
    LOG_FILE_SEVERITY_DEBUG = 1;
    LOG_FILE_SEVERITY_INFO = 2;
    LOG_FILE_SEVERITY_WARN = 3;
    LOG_FILE_SEVERITY_ERROR = 4;
    LOG_FILE_SEVERITY_FATAL = 5;
}

message GetConfigurationRequest {}

message SetConfigurationResponse {
    bool success = 1;
    string message = 2;
}

message FmeConfig {
    GeneralSettings general = 1;
    LoggingSettings logging = 2;
    ReportsSettings reports = 3;
    ApiServerSettings api_server = 4;
    Protocols protocols = 5;
    ApiServerRemoteSettings api_server_remote = 6;
    repeated UploadHotFolderSettings upload_hot_folders = 7;
}

message GeneralSettings {
    bool no_sleep = 1;
    uint32 retry_count = 2;
    int32 max_active_transfers = 5;
    int32 max_active_checksums = 6;
    int32 target_bandwidth = 7;
    // Opt-in: when true, the daemon auto-scales max_active_transfers to the machine
    // (CPU cores bounded by the open-file limit), ignoring the explicit value above.
    bool auto_max_active_transfers = 8;
}

message LoggingSettings {
    string directory = 1;
    string severity = 2;
    int32 max_size = 3;
    int32 max_age = 4;
    bool compress = 5;
}

message ReportsSettings {
    string directory = 1;
}

message ApiServerSettings {
    bool enabled = 1;
    ApiServerRemoteSettings remote = 3;
    repeated string blocked_paths = 4;
    repeated string allowed_origins = 5;
    ApiServerTlsSettings tls = 6;
    ApiServerPermissions permissions = 7;
}

message ApiServerRemoteSettings {
    bool enabled = 1;
    string pre_shared_key = 2;
    string address = 3;
    repeated uint32 ports = 4;
}

message ApiServerTlsSettings {
    bool enabled = 1;
    string certificate_file = 2;
    string key_file = 3;
}

message ApiServerPermissions {
    bool allow_ui_configuration = 1;
    bool allow_local_rename_delete = 2;
    bool allow_remote_rename_delete = 3;
}

message Protocols {
    S3Settings s3 = 1;
}

message S3Settings {
    map<string, TransferProfile> transfer_profiles = 10;
}

enum AuthMethod {
    AUTH_METHOD_UNSPECIFIED = 0;
    AUTH_METHOD_AWS_PROFILE = 1;
    AUTH_METHOD_OIDC = 2;
    // Static access key ID / secret access key (optional session token) stored in the configuration file.
    AUTH_METHOD_STATIC_KEYS = 3;
}

// Which S3 implementation a TransferProfile talks to. UNSPECIFIED is treated as AWS so that
// configurations written before this field existed keep working unchanged.
enum S3Provider {
    S3_PROVIDER_UNSPECIFIED = 0;
    S3_PROVIDER_AWS = 1;
    S3_PROVIDER_MINIO = 2;
    S3_PROVIDER_CLOUDFLARE_R2 = 3;
    S3_PROVIDER_BACKBLAZE_B2 = 4;
    S3_PROVIDER_WASABI = 5;
    S3_PROVIDER_DIGITALOCEAN_SPACES = 6;
    // Any other S3-compatible endpoint (Ceph RGW, Garage, SeaweedFS, ...).
    S3_PROVIDER_OTHER = 7;
    S3_PROVIDER_HETZNER = 8;
}

// Static credentials used when auth_method is AUTH_METHOD_STATIC_KEYS.
// GetConfiguration never returns stored secrets: secret_access_key and session_token are sent as
// "***REDACTED***" when a value is stored. A client that sends that placeholder back (SetConfiguration,
// ValidateTransferProfile) keeps the stored value, as long as the profile name and access_key_id are unchanged.
message StaticCredentials {
    string access_key_id = 1;
    string secret_access_key = 2;
    string session_token = 3;
}

// TLS settings for the S3 endpoint connection.
message EndpointTlsSettings {
    // Path (on the daemon host) to a PEM bundle appended to the system trust store. Empty uses system roots only.
    string ca_bundle = 1;
    // Disables TLS certificate verification. Insecure; only for trusted lab networks.
    bool skip_verify = 2;
}

message OIDCConfig {
    string issuer_url = 1;
    string client_id = 2;
    string role_arn = 3;
    repeated string scopes = 4;
    bool persist_session = 5;
    string custom_ca_bundle = 6;
    int32 session_duration_seconds = 7;
}

message TransferProfile {
    string name = 1;
    string bucket = 2;
    string region = 3;
    string profile = 4;
    bool accelerated = 5;
    repeated string file_order = 6;
    bool enable_metadata_filter = 8;
    string storage_class = 9;
    PathsSettings paths = 10;
    int32 chunk_size = 11;
    int32 threads = 12;
    string max_age = 13;
    string filter = 14;
    bool auto_tuning = 16;
    ChecksumSettings checksums = 17;
    string endpoint = 18;
    AuthMethod auth_method = 19;
    OIDCConfig oidc_config = 20;
    S3Provider provider = 21;
    // Use path-style addressing (https://endpoint/bucket/key) instead of virtual-hosted style.
    bool path_style = 22;
    StaticCredentials static_credentials = 23;
    EndpointTlsSettings tls = 24;
}

message ValidateTransferProfileRequest {
    TransferProfile transfer_profile = 1;
}

message ValidateTransferProfileResponse {
    bool success = 1;
    string message = 2;
}

message UploadHotFolderSettings {
    bool enabled = 1;
    string local_source_folder = 2;
    string name = 3;
    repeated HotFolderTransferConfigurations remote_configurations = 4;
    // When true, the whole source folder is (re)uploaded with Force on daemon start and when the
    // hot folder is (re)configured, even if the objects already exist in S3. Defaults to false so
    // the initial sweep skips already-uploaded files; set true to preserve the legacy behavior.
    bool force_initial_upload = 5;
}

message HotFolderTransferConfigurations {
    string remote_configuration_name = 1;
    string s3_destination_folder = 2;
}

message PathsSettings {
    string local = 1;
    string remote = 2;
}

message ChecksumSettings {
    bool enabled = 1;
    string algorithm = 2;
}

message GRPCFmeConfig {
    GeneralSettings general = 1;
    LoggingSettings logging = 2;
    ReportsSettings reports = 3;
    Protocols protocols = 4;
    repeated UploadHotFolderSettings upload_hot_folders = 5;
}


